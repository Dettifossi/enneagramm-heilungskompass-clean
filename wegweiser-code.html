<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Wegweiser-Code senden</title>
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Code senden" />
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5e8cc; color: #1a1208; margin: 0; padding: 0; }
      .wrap { max-width: 420px; margin: 0 auto; padding: 3rem 1.2rem 2rem; }
      h1 { font-size: 1.2rem; margin: 0 0 1.5rem; }
      p.hint { color: #6b5d45; font-size: 0.88rem; line-height: 1.5; margin-bottom: 1.2rem; }
      input { width: 100%; box-sizing: border-box; padding: 0.7rem; font-size: 1rem; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 0.8rem; }
      button { background: #a8872d; color: #fff; border: none; border-radius: 8px; padding: 0.7rem 1.5rem; font-weight: 700; font-size: 1rem; cursor: pointer; }
      #status { margin-top: 1rem; font-size: 0.9rem; }
      #gate, #form { display: none; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div id="gate">
        <h1>Admin-Code eingeben</h1>
        <input id="admin-code" type="password" placeholder="Code..." autocomplete="off" />
        <button id="gate-btn">Einloggen</button>
      </div>
      <div id="form">
        <h1>Wegweiser-Zugangscode senden</h1>
        <p class="hint">E-Mail-Adresse des Abonnenten eingeben und senden – er bekommt sofort eine neue E-Mail mit frischem 6-stelligem Code (30 Minuten gültig).</p>
        <input id="email" type="email" placeholder="kunde@beispiel.de" autocomplete="off" />
        <button id="send-btn">Code senden</button>
        <p id="status"></p>
      </div>
    </div>
    <script>
      const ADMIN_CODE = "rathmer9";
      const WORKER_URL = "https://kompass-assistent.9rathmer.workers.dev";
      const gate = document.getElementById("gate");
      const form = document.getElementById("form");

      function unlocked() {
        try { return localStorage.getItem("wegweiser-admin-unlocked") === "1"; } catch (e) { return false; }
      }
      function show() {
        if (unlocked()) { gate.style.display = "none"; form.style.display = "block"; }
        else { gate.style.display = "block"; form.style.display = "none"; }
      }
      document.getElementById("gate-btn").addEventListener("click", () => {
        const v = document.getElementById("admin-code").value;
        if (v === ADMIN_CODE) {
          try { localStorage.setItem("wegweiser-admin-unlocked", "1"); } catch (e) {}
          show();
        } else { alert("Falscher Code"); }
      });
      document.getElementById("send-btn").addEventListener("click", () => {
        const email = document.getElementById("email").value.trim();
        const status = document.getElementById("status");
        if (!email) return;
        status.textContent = "Sende …";
        status.style.color = "#1a1208";
        fetch(WORKER_URL + "/auth/request-link", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: email }),
        })
          .then((r) => r.json())
          .then((data) => {
            status.textContent = data.message || data.error || "Fertig.";
            status.style.color = data.error ? "#e74c3c" : "#27ae60";
          })
          .catch(() => {
            status.textContent = "Verbindungsfehler. Bitte erneut versuchen.";
            status.style.color = "#e74c3c";
          });
      });
      show();
    </script>
  </body>
</html>
