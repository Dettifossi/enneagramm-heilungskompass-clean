<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spruchbilder – Werkzeug</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/svg+xml" href="./favicon.svg" />
<style>
  :root { --ivory:#f7f1e6; --paper:#fffaf0; --sand:#d2c0a1; --copper:#a5603d; --ink:#28241f; --muted:#72665a; --line:rgba(40,36,31,.14); }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Georgia,serif; background:var(--ivory); color:var(--ink); }
  header { position:sticky; top:0; z-index:5; background:color-mix(in srgb,var(--paper) 88%,transparent); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); border-bottom:1px solid var(--line); padding:.8rem 1rem; }
  h1 { margin:0 0 .6rem; font-size:1.1rem; color:var(--copper); }
  .bar { display:flex; gap:.5rem; flex-wrap:wrap; }
  input,select { font:inherit; font-size:16px; padding:.5rem .7rem; border:1px solid var(--line); border-radius:8px; background:#fff; }
  input { flex:1 1 200px; }
  .info { font-size:.85rem; color:var(--muted); margin:.5rem 0 0; }
  main { max-width:1100px; margin:0 auto; padding:1rem; display:grid; gap:1rem; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); }
  .c { background:var(--paper); border:1px solid var(--line); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; }
  .c img { width:100%; aspect-ratio:1; display:block; background:var(--sand); object-fit:cover; }
  .c .t { padding:.6rem .8rem 0; font-size:.78rem; color:var(--muted); }
  .row { display:flex; flex-wrap:wrap; gap:.4rem; padding:.6rem .8rem .8rem; }
  button { font:inherit; font-size:.85rem; padding:.45rem .7rem; border-radius:8px; border:1.5px solid var(--copper); background:transparent; color:var(--copper); cursor:pointer; }
  button.p { background:var(--copper); color:#fff; }
  button:active { transform:scale(.97); }
  .toast { position:fixed; left:50%; bottom:1.2rem; transform:translateX(-50%); background:var(--ink); color:#fff; padding:.6rem 1rem; border-radius:10px; font-size:.9rem; opacity:0; transition:opacity .25s; pointer-events:none; z-index:10; }
  .toast.on { opacity:1; }
</style>
</head>
<body>
<header>
  <h1>Spruchbilder – 500 Sprüche zum Veröffentlichen</h1>
  <div class="bar">
    <input id="s" type="search" placeholder="Suchen (Spruch oder Autor) …" />
    <select id="th"><option value="">Alle Themen</option></select>
    <select id="ch" title="Kanal für die Link-Auswertung">
      <option value="fb">Kanal: Facebook</option><option value="wa">Kanal: WhatsApp</option><option value="xing">Kanal: Xing</option><option value="x">Kanal: X</option><option value="ig">Kanal: Instagram</option><option value="tt">Kanal: TikTok</option><option value="li">Kanal: LinkedIn</option>
    </select>
  </div>
  <p class="info" id="n"></p>
</header>
<main id="g"></main>
<div class="toast" id="to"></div>
<script src="data/zitate.js"></script>
<script>
(function () {
  var R2 = "https://pub-2851309644cc48aea2a2ae780b41b196.r2.dev/assets/sprueche/";
  var BASE = "https://kompass.verlagshausrathmer.com/spruch/";
  var Z = (window._zitateData || []).map(function (z, i) { z.n = ("00" + (i + 1)).slice(-3); return z; });
  var g = document.getElementById("g"), s = document.getElementById("s"), th = document.getElementById("th"), ch = document.getElementById("ch"), nEl = document.getElementById("n");
  var themen = Array.from(new Set(Z.map(function (z) { return z.t; }))).sort();
  themen.forEach(function (t) { var o = document.createElement("option"); o.value = t; o.textContent = t; th.appendChild(o); });
  function esc(x) { return String(x).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function toast(m) { var t = document.getElementById("to"); t.textContent = m; t.classList.add("on"); setTimeout(function () { t.classList.remove("on"); }, 1800); }
  function link(z) { return BASE + z.n + ".html?q=" + ch.value; }
  function text(z) {
    var kopf = "„" + z.q + "“ – " + z.a + "\n\nWelcher Typ steckt in diesem Satz? ";
    if (ch.value === "ig") return kopf + "Mehr dazu über den Link in der Bio.\n\n#Enneagramm #Selbsterkenntnis #Persönlichkeit #Psychologie";
    if (ch.value === "tt") return kopf + "Mehr dazu über den Link in der Bio.\n\n#Enneagramm #Selbsterkenntnis #Persönlichkeit #Psychologie #Zitate";
    return kopf + "→ " + link(z) + "\n\n#Enneagramm #Selbsterkenntnis";
  }
  function render() {
    var q = s.value.trim().toLowerCase(), t = th.value;
    var L = Z.filter(function (z) { return (!t || z.t === t) && (!q || (z.q + " " + z.a).toLowerCase().indexOf(q) > -1); });
    nEl.textContent = L.length + " von " + Z.length + " Sprüchen. „Text kopieren“ enthält den Link zur Landingpage des Spruchs, passend zum gewählten Kanal.";
    g.innerHTML = L.slice(0, 60).map(function (z) {
      return '<div class="c" data-n="' + z.n + '"><img loading="lazy" alt="' + esc(z.q) + '" src="' + R2 + z.n + '-quadrat.jpg"><div class="t">' + z.n + " · " + esc(z.t) + '</div><div class="row">' +
        '<button class="p" data-a="copy">Text + Link kopieren</button><button data-a="q">Quadrat speichern</button><button data-a="st">Story speichern</button><button data-a="pg">Seite ansehen</button></div></div>';
    }).join("") + (L.length > 60 ? '<p class="info" style="grid-column:1/-1">Es werden die ersten 60 gezeigt, bitte mit der Suche oder dem Thema eingrenzen.</p>' : "");
  }
  function save(url, name) {
    fetch(url).then(function (r) { return r.blob(); }).then(function (b) {
      var a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = name; a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    }).catch(function () { window.open(url, "_blank"); toast("Bild öffnet sich, dort lang drücken bzw. rechtsklicken zum Speichern"); });
  }
  g.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    var z = Z[parseInt(b.closest(".c").dataset.n, 10) - 1], a = b.dataset.a;
    if (a === "copy") { (navigator.clipboard ? navigator.clipboard.writeText(text(z)) : Promise.reject()).then(function () { toast("Text und Link kopiert"); }, function () { prompt("Bitte kopieren:", text(z)); }); }
    if (a === "q") save(R2 + z.n + "-quadrat.jpg", "spruch-" + z.n + "-quadrat.jpg");
    if (a === "st") save(R2 + z.n + "-story.jpg", "spruch-" + z.n + "-story.jpg");
    if (a === "pg") window.open(link(z), "_blank");
  });
  s.addEventListener("input", render); th.addEventListener("change", render);
  render();
})();
</script>
</body>
</html>
