<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<title>Kompass-Assistent – Prototyp</title>
<style>
  body { font-family: Georgia, serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #28241f; background: #faf6ee; }
  h1 { font-size: 1.4rem; }
  #chat { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; min-height: 200px; background: #fff; margin-bottom: 1rem; }
  .msg { margin-bottom: 1rem; white-space: pre-wrap; line-height: 1.5; }
  .msg.user { font-weight: bold; }
  .msg.sources { font-size: 0.85rem; color: #886; }
  form { display: flex; gap: 0.5rem; }
  input { flex: 1; padding: 0.6rem; font-size: 1rem; }
  button { padding: 0.6rem 1.2rem; font-size: 1rem; cursor: pointer; }
</style>
</head>
<body>
  <h1>🧭 Kompass-Assistent — Prototyp (nur lokal)</h1>
  <p>Stell eine Frage zu einem Subtyp, z. B. „Was ist die Wunde von SO4?“</p>
  <div id="chat"></div>
  <form id="askForm">
    <input id="question" type="text" placeholder="Deine Frage..." autofocus />
    <button type="submit">Fragen</button>
  </form>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("askForm");
    const input = document.getElementById("question");

    function addMsg(text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const question = input.value.trim();
      if (!question) return;
      addMsg("Du: " + question, "user");
      input.value = "";
      addMsg("... denkt nach ...", "loading");

      try {
        const res = await fetch("http://localhost:8787/api/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });
        const data = await res.json();
        chat.removeChild(chat.lastChild);
        if (data.error) {
          addMsg("Fehler: " + data.error, "sources");
        } else {
          addMsg(data.answer, "answer");
          if (data.sources && data.sources.length) {
            addMsg("Quellen: " + data.sources.join(", "), "sources");
          }
        }
      } catch (err) {
        chat.removeChild(chat.lastChild);
        addMsg("Verbindungsfehler — läuft der lokale Server? (node ai-prototype/server.mjs)", "sources");
      }
    });
  </script>
</body>
</html>
