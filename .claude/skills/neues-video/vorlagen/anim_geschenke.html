<script>

const W=LAND?1920:1080,H=LAND?1080:1920;const cv=document.getElementById('c');cv.width=W;cv.height=H;const g=cv.getContext('2d');
const B=60/107.7,P=0.09;

S.push(APP+12*B);const T=S[11],SCN=11;

function rr(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r);}

function snow(t,n=70,a=0.8){for(let i=0;i<n;i++){const sp=60+rnd(i)*110,r=2+rnd(i+7)*4.5;const y=((rnd(i+3)*H*1.3+t*sp)%(H+40))-20;const x=((rnd(i+5)*W+Math.sin(t*0.9+i)*28)%W+W)%W;g.fillStyle=`rgba(255,255,255,${a*(0.35+0.65*rnd(i+11))})`;g.beginPath();g.arc(x,y,r,0,7);g.fill();}}
function star(x,y,r,col){g.fillStyle=col;g.beginPath();g.moveTo(x,y-r);g.lineTo(x+r*0.27,y-r*0.27);g.lineTo(x+r,y);g.lineTo(x+r*0.27,y+r*0.27);g.lineTo(x,y+r);g.lineTo(x-r*0.27,y+r*0.27);g.lineTo(x-r,y);g.lineTo(x-r*0.27,y-r*0.27);g.closePath();g.fill();}

function box(c,o,s,p,n,small){
 const dark=shade(c,0.78),W_=small?1:1;
 g.save();
 if(o>0){g.save();g.rotate(0);for(let i=0;i<14;i++){g.save();g.rotate(i/14*Math.PI*2+s*0.4);g.fillStyle=`rgba(255,240,190,${0.26*Math.min(1,o*2)})`;g.beginPath();g.moveTo(-26,-40);g.lineTo(0,-340-p*30);g.lineTo(26,-40);g.fill();g.restore();}g.restore();}
 // Korpus
 g.shadowColor='rgba(0,0,0,.4)';g.shadowBlur=30;g.fillStyle=dark;g.beginPath();g.roundRect(-150,-60,300,230,16);g.fill();g.shadowBlur=0;

 // Deckel (hebt ab)

 g.fillStyle=c;g.beginPath();g.roundRect(-170,-130,340,80,14);g.fill();g.fillStyle='#fff6df';g.fillRect(-20,-130,40,80);
 g.fillStyle='#fff6df';g.beginPath();g.ellipse(-50,-152,48,32,-0.5,0,7);g.ellipse(50,-152,48,32,0.5,0,7);g.fill();g.fillStyle='#e9d9b0';g.beginPath();g.arc(0,-138,18,0,7);g.fill();

 if(o>0.05){for(let i=0;i<9;i++){const a=rnd(i)*7+s*0.8,r=190+rnd(i+4)*90;const sc=0.5+0.5*Math.sin(s*5+i*2);star(Math.cos(a)*r,Math.sin(a)*r*0.8-80,26*sc,'#fff');}}

}
const DARKTXT=[0,0,0,1,1,0,0,1,0,1];
function bgType(c){const gr=g.createLinearGradient(0,0,W*0.2,H);gr.addColorStop(0,shade(c,0.62));gr.addColorStop(1,shade(c,0.16));g.fillStyle=gr;g.fillRect(0,0,W,H);
 const rg=g.createRadialGradient(L.mx,L.my,20,L.mx,L.my,520);rg.addColorStop(0,'rgba(255,240,200,.28)');rg.addColorStop(1,'rgba(255,240,200,0)');g.fillStyle=rg;g.fillRect(0,0,W,H);}
function typeScene(n,s,t,p){
 const c=COL[n];bgType(c);
 g.save();g.globalAlpha=0.1;g.fillStyle='#fff';g.font=`700 ${LAND?1200:1500}px Georgia`;g.textAlign='center';g.fillText(n,LAND?W*0.27:W/2,LAND?H*0.97:H*0.56);g.restore();
 snow(t);
 // Paket faellt herein, wackelt, oeffnet sich
 const drop=bounce(s/0.6);const y=-(1-drop)*700;
 const shake=(s>2.4&&s<3.0)?Math.sin(s*60)*0.05*((s-2.4)/0.6):0;
 const o=ease((s-3.0)/0.5);
 g.save();g.translate(L.mx,L.my+y+(LAND?0:40));const z=(LAND?1.25:1.5)*(1+p*0.02);g.scale(z,z);g.rotate(shake);box(c,o,s,p,n);g.restore();
 // Textfeld
 const pf=ease((s-0.2)/0.4);
 g.save();g.globalAlpha=pf;g.fillStyle='rgba(8,12,28,.58)';rr(L.px,L.py,L.pw,L.ph,44);g.fill();g.restore();
 const cx=L.px+L.pw/2;g.textAlign='center';const fs=LAND?52:60;
 // Phase 1: Typ + Frage
 const a=Math.min(1,Math.max(0,(s-0.5)/0.3))*(1-Math.min(1,Math.max(0,(s-3.0)/0.3)));
 if(a>0){g.save();g.globalAlpha=a;g.font=`700 ${LAND?36:40}px -apple-system,Helvetica`;g.fillStyle='#ffe9a8';g.fillText((TX_.type+n).split('').join(' '),cx,L.py+L.ph*0.3);
  g.font=`700 ${LAND?66:76}px Georgia,serif`;g.fillStyle='#fff';g.shadowColor='#000';g.shadowBlur=12;g.fillText(TX_.nm[n],cx,L.py+L.ph*0.52);
  g.font=`500 ${LAND?46:52}px -apple-system,Helvetica`;g.fillStyle='#f3e9dc';g.shadowBlur=0;g.fillText(TX_.ask,cx,L.py+L.ph*0.74);g.restore();}
 // Phase 2: Geschenk + Begruendung
 const b=Math.min(1,Math.max(0,(s-3.4)/0.35));
 if(b>0){g.save();g.globalAlpha=b;g.font=`700 ${LAND?32:36}px -apple-system,Helvetica`;g.fillStyle='#ffe9a8';g.fillText(TX_.lbl.split('').join(' '),cx,L.py+(LAND?70:78));
  g.font=`700 ${LAND?60:68}px Georgia,serif`;g.fillStyle='#fff';g.shadowColor='#000';g.shadowBlur=12;const ls=wrapLines(TX_.gift[n],L.pw-80);ls.forEach((ln,i)=>g.fillText(ln.join(' '),cx,L.py+(LAND?160:170)+i*(LAND?70:78)));g.shadowBlur=0;
  const a2=Math.min(1,Math.max(0,(s-4.1)/0.4));g.globalAlpha=b*a2;g.font=`500 ${LAND?40:44}px -apple-system,Helvetica`;g.fillStyle='#f3e9dc';const w2=wrapLines(TX_.why[n],L.pw-100);const y2=L.py+(LAND?160:170)+ls.length*(LAND?70:78)+(LAND?60:66);w2.forEach((ln,i)=>g.fillText(ln.join(' '),cx,y2+i*(LAND?54:58)));g.restore();}

function boxes(s,t,p,hi){
 const cx=LAND?470:540,cy=LAND?560:650,size=LAND?800:860,gap=size*0.04,ts=(size-2*gap)/3;
 for(let k=0;k<9;k++){const n=k+1;const r=Math.floor(k/3),c=k%3;const f=bounce((s-0.15-k*0.17)/0.5);if(f<=0)continue;
  const x=cx-size/2+ts/2+c*(ts+gap),y=cy-size/2+ts/2+r*(ts+gap);
  let sc=f,al=1;if(hi){const act=((Math.floor((t-P)/B)%9)+9)%9+1;sc*=act==n?1.18:0.92;al=act==n?1:0.75;}
  g.save();g.globalAlpha=al;g.translate(x,y);g.scale(sc*(1+p*0.02)*ts/380,sc*(1+p*0.02)*ts/380);g.translate(0,20);box(COL[n],hi&&((Math.floor((t-P)/B)%9)+9)%9+1==n?ease((t%B)/(B*0.5)):0,s,p,n,true);g.restore();}
}
function introScene(s,t,p){
 const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#0b1a3a');gr.addColorStop(.6,'#1c3b6b');gr.addColorStop(1,'#0b1a3a');g.fillStyle=gr;g.fillRect(0,0,W,H);
 for(let i=0;i<50;i++){g.fillStyle=`rgba(255,255,255,${0.3+0.6*rnd(i+3)})`;g.beginPath();g.arc(rnd(i)*W,rnd(i+9)*H*0.5,1+rnd(i+5)*2,0,7);g.fill();}

}
function questionScene(s,t,p){

function appScene(s,t,p){
 const gr=g.createLinearGradient(0,0,W,H);gr.addColorStop(0,'#b9703f');gr.addColorStop(1,'#4a2616');g.fillStyle=gr;g.fillRect(0,0,W,H);
 const cx=LAND?470:540,PS=LAND?0.8:0.85,PY=LAND?560:650;snow(t,50,0.6);
 for(let i=0;i<5;i++){const ph=((t-P)/(B*4)+i/5);const f=ph-Math.floor(ph);g.strokeStyle=`rgba(255,230,200,${(1-f)*0.3})`;g.lineWidth=3+(1-f)*8;g.beginPath();g.arc(cx,PY,300+f*900,0,7);g.stroke();}
 const ent=bounce(s/0.9);const sc=(1+p*0.014)*PS;
 g.save();g.translate(cx,PY+(1-ent)*1100+Math.sin(s*1.6)*10);g.rotate((1-ent)*0.25);g.scale(sc,sc);
 g.shadowColor='#000c';g.shadowBlur=70;g.fillStyle='#17120f';g.beginPath();g.roundRect(-250,-505,500,1010,62);g.fill();g.shadowBlur=0;
 g.strokeStyle='#e3b48a';g.lineWidth=4;g.beginPath();g.roundRect(-250,-505,500,1010,62);g.stroke();
 g.save();g.beginPath();g.roundRect(-226,-481,452,978,44);g.clip();g.fillStyle='#dfeaec';g.fillRect(-226,-481,452,978);
 const D=3.4,k=Math.min(1,Math.floor(s/D)),u=Math.min(1,(s-k*D)/0.55),e=ease(u);
 const drawImg=(n,x)=>{const im=IM[n];const w=452,h=452*im.height/im.width;g.drawImage(im,x-226,-481,w,Math.max(h,978));};
 if(k>0&&u<1){drawImg(SHOTS[k-1],-452*e);drawImg(SHOTS[k],452*(1-e));}else drawImg(SHOTS[k],0);
 g.restore();g.fillStyle='#17120f';g.beginPath();g.roundRect(-70,-481,140,30,15);g.fill();g.restore();
 for(let i=0;i<2;i++){g.fillStyle=i==k?'#fff':'rgba(255,255,255,.35)';g.beginPath();g.arc(cx+(i-0.5)*34,PY+505*PS+36,i==k?11:8,0,7);g.fill();}
}
function frame(t,si,s,p){

 overlay(t,si,s,p);
 if(s<0.28&&si>0){for(let i=0;i<7;i++){const y=rnd(i+si*9)*H,h=30+rnd(i+3)*140,dx=(rnd(i+7)-.5)*120*(1-s/0.28);g.drawImage(cv,0,y,W,h,dx,y,W,h);}}
 if(s<0.25){g.fillStyle=`rgba(255,255,255,${0.7*(1-s/0.25)})`;g.fillRect(0,0,W,H);}
 const v=g.createRadialGradient(W/2,H/2,Math.min(W,H)*0.55,W/2,H/2,Math.max(W,H)*0.65);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.4)');g.fillStyle=v;g.fillRect(0,0,W,H);
 if(t>T-1.4){g.fillStyle=`rgba(0,0,0,${(t-(T-1.4))/1.4})`;g.fillRect(0,0,W,H);}
}
function overlay(t,si,s,p){

 if(si>=1&&si<=9){const lab=TX_.type+si;g.font='700 40px -apple-system,Helvetica';const w=g.measureText(lab).width+80;g.fillStyle='rgba(0,0,0,.42)';rr(W/2-w/2,PYL-12,w,76,38);g.fill();g.fillStyle='#fff';g.fillText(lab,W/2,PYL+40);return;}
 let blk=null;const isApp=si==10&&t>=APP;
 if(si==0)blk=TX_.intro;else if(si==10)blk=isApp?TX_.app:TX_.q;
 if(!blk)return;

 const TX=LAND?1370:540,TY=LAND?400:1240,TW=LAND?860:940,CAPY=LAND?690:1540,CAPW=LAND?800:880;
 if(LAND){const band=g.createLinearGradient(900,0,1100,0);band.addColorStop(0,'rgba(0,0,0,0)');band.addColorStop(1,'rgba(0,0,0,.5)');g.fillStyle=band;g.fillRect(900,0,W-900,H);}
 else{const band=g.createLinearGradient(0,1020,0,1920);band.addColorStop(0,'rgba(0,0,0,0)');band.addColorStop(.35,'rgba(0,0,0,.55)');band.addColorStop(1,'rgba(0,0,0,.65)');g.fillStyle=band;g.fillRect(0,1020,W,900);}
 g.fillStyle='rgba(0,0,0,.45)';g.fillRect(0,LAND?40:70,W,100);g.font='600 40px -apple-system,Helvetica';g.fillStyle='#f6c9a0';g.fillText(blk.k.toUpperCase().split('').join(' '),W/2,(LAND?40:70)+64);
 g.font='700 100px Georgia,serif';g.fillStyle='#fff';
 blk.t.forEach((line,li)=>{const f=bounce((ls-0.15-li*0.35)/0.55);if(f<=0)return;const fit=Math.min(1,TW/g.measureText(line).width);g.save();g.translate(TX,TY+li*118);g.scale(f*fit,f*fit);g.globalAlpha=Math.min(1,f*1.5);g.shadowColor='#000';g.shadowBlur=30;g.fillText(line,0,0);g.restore();});
 const f=Math.min(1,Math.max(0,(ls-0.7)/(B*3)));g.font='500 46px -apple-system,Helvetica';g.fillStyle='#f3e9dc';
 const words=blk.c.split(' ');const n=Math.ceil(words.length*f);g.save();g.beginPath();g.rect(TX-CAPW/2-20,CAPY-60,CAPW+40,260);g.clip();
 if(f>0){const lines=[];let line=[];for(const w of words){if(g.measureText(line.concat(w).join(' ')).width>CAPW&&line.length){lines.push(line);line=[w];}else line.push(w);}lines.push(line);let c=0;lines.forEach((ln,i)=>{const take=Math.max(0,Math.min(ln.length,n-c));c+=ln.length;if(take>0)g.fillText(ln.slice(0,take).join(' '),TX,CAPY+i*62);});}
 g.restore();
 const URLY=LAND?1030:1880;
 if(isApp){const pf=bounce((ls-1.2)/0.6);if(pf>0){const py=CAPY+(LAND?150:170);g.save();g.translate(TX,py);const ps=pf*(1+p*0.03);g.scale(ps,ps);g.shadowColor='#fff';g.shadowBlur=24+p*30;g.fillStyle='#f6efe4';g.beginPath();g.roundRect(-300,-44,600,88,44);g.fill();g.shadowBlur=0;g.fillStyle='#7a3f22';g.font='700 38px -apple-system,Helvetica';g.fillText(TX_.pill,0,13);g.restore();}
  const tf=Math.min(1,Math.max(0,(ls-2.2)/0.8));if(tf>0){g.save();g.globalAlpha=tf;g.font='italic 400 36px Georgia,serif';g.fillStyle='#fff3e4';g.fillText(TX_.tag,TX,URLY-(LAND?62:72));g.restore();}}
 g.font=isApp?'700 40px -apple-system,Helvetica':'600 32px -apple-system,Helvetica';g.fillStyle='#f6c9a0';g.fillText('kompass.verlagshausrathmer.com'+(EN&&isApp?'/en/':''),TX,URLY);
}

</script>
