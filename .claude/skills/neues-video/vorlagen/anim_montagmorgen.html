  g.fillStyle='#fff';for(let i=0;i<8;i++){const a=rnd(i)*7+s*0.7,r=240+rnd(i+4)*60;const x=Math.cos(a)*r,y=Math.sin(a)*r;const sc=0.5+0.5*Math.sin(s*5+i*2);g.save();g.translate(x,y);g.scale(sc,sc);g.beginPath();g.moveTo(0,-26);g.lineTo(7,-7);g.lineTo(26,0);g.lineTo(7,7);g.lineTo(0,26);g.lineTo(-7,7);g.lineTo(-26,0);g.lineTo(-7,-7);g.closePath();g.fill();g.restore();}
 }
